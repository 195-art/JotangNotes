spring.application.name=JotangNote
server.port=${PORT:8080}

# 服务配置支持环境变量；AI Key 按项目约定保留内置值。
# JWT 签名密钥（上线务必换成随机值，默认是开发占位值）
jwt.secret=${JWT_SECRET:jotangnote-secret-key-please-change-me-1234567890}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jotangnote}?sslMode=PREFERRED&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# 同一消息本地重试 3 次，耗尽后重入保序队列；不跳过失败操作。
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.amqp.deserialization.trusted-package=org.example.jotangnote

mimo.base-url=https://api.xiaomimimo.com/v1
mimo.api-key=sk-c8phigcqfhql0y07ypx22t9u01md7ll5w0wbfayl4jdf8zvb
mimo.model=mimo-v2.5

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.data.redis.password=${REDIS_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
